[project]
name = "federated"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SohaKhare", email = "sohaajaykhare2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flwr[simulation]>=1.34,<2.0",
    "pandas>=2.2,<3.0",
    "torch>=2.7,<3.0",
]

[project.scripts]
federated = "federated:main"
prepare-data = "federated.prepare_data:main"
run-federated = "federated.run:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.flwr.app]
publisher = "local"

[tool.flwr.app.components]
serverapp = "federated.server_app:app"
clientapp = "federated.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 1
local-epochs = 3
batch-size = 32
learning-rate = 0.01

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
